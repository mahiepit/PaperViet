name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip pymupdf pypdf pytest
      - name: Run tests
        run: python -m pytest -v

  minimal:
    # The scripts must still work (and tests must skip cleanly) without any PDF library.
    name: no PDF library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pytest -v
      - name: Missing-dependency message
        shell: bash
        run: |
          set +e
          python skills/paper-viet/scripts/extract_pdf.py examples/sample-paper.pdf --out /tmp/w
          code=$?
          test "$code" -eq 3

  skilllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mahiepit/SkillLint@v1
        with:
          strict: "true"
